services:
    app:
        build: .
        ports:
            - '8000:8000'
        environment:
            APP_NAME: 'Customer Support Refund System'
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: 'false'
            APP_URL: http://localhost:8000
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/storage/app-data/database.sqlite
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: sync
            REFUND_AI_MODE: ${REFUND_AI_MODE:-demo}
            REFUND_AI_PROVIDER: ${REFUND_AI_PROVIDER:-openai}
            REFUND_AI_MODEL: ${REFUND_AI_MODEL:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            SUPPORT_DEMO_EMAIL: ${SUPPORT_DEMO_EMAIL:-support@example.test}
            SUPPORT_DEMO_PASSWORD: ${SUPPORT_DEMO_PASSWORD:-DemoSupport123!}
            CUSTOMER_DEMO_PASSWORD: ${CUSTOMER_DEMO_PASSWORD:-DemoCustomer123!}
        volumes:
            - refund_data:/var/www/html/storage/app-data
            - ./app:/var/www/html/app
            - ./resources:/var/www/html/resources

volumes:
    refund_data:
